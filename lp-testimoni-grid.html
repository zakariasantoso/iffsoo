<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFFSOO Gold | Review Pelanggan & Harga Terbaik</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f7f7f9;color:#111}
    .wrap{max-width:980px;margin:auto;padding:16px}
    .head{background:#fff;padding:18px;border-radius:14px;border:1px solid #ececec}
    .btn{color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:700;display:inline-block}
    .btn-sp{background:#ee4d2d}.btn-wa{background:#25D366}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
    .card{background:#fff;border:1px solid #ececec;border-radius:12px;padding:10px}
    img{width:100%;height:100%;object-fit:cover;border-radius:8px}
    .sticky{position:fixed;left:0;right:0;bottom:0;padding:10px;background:rgba(255,255,255,.94);border-top:1px solid #e4e4e4;text-align:center}
    .space{height:80px}
    .price-ribbon{display:inline-block;margin:8px 0 12px;padding:8px 12px;border-radius:999px;background:linear-gradient(90deg,#fff3cd,#ffe08a);color:#4b3900;font-weight:700}
    .price-ribbon .old{text-decoration:line-through;opacity:.7;margin-right:8px}
  </style>
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','948013317787488');fbq('track','PageView');fbq('track','ViewContent',{content_name:'LP Testimoni Grid IFFSOO'});
  </script>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>IFFSOO Gold Herbal Original</h1>
      <p>Lanjut order cepat via Shopee (COD tersedia). Kalau mau tanya dulu, bisa via WhatsApp.</p>
      <div class="price-ribbon"><span class="old">Rp150.000</span>Rp130.000 + Bonus Kurma</div>
      <div class="row">
        <a id="spTop" class="btn btn-sp" href="#">Beli via Shopee (COD)</a>
        <a id="waTop" class="btn btn-wa" href="#">Konsultasi via WA</a>
      </div>
    </div>

    <div class="grid">
      <div class="card"><img src="assets/487120268_17848265928439091_162934762815120517_n.webp" alt="Kata Pembeli 1"></div>
      <div class="card"><img src="assets/487505309_17848999203439091_753614494266383513_n.webp" alt="Kata Pembeli 2"></div>
      <div class="card"><img src="assets/491335553_17851691592439091_7326497496436954666_n.webp" alt="Kata Pembeli 3"></div>
      <div class="card"><img src="assets/495227367_17852972964439091_4879537837142314239_n.webp" alt="Kata Pembeli 4"></div>
      <div class="card"><img src="assets/WhatsApp Image 2025-04-28 at 19.55.47.jpeg" alt="Kata Pembeli 5"></div>
      <div class="card"><img src="assets/WhatsApp Image 2026-02-08 at 11.44.42.jpeg" alt="Kata Pembeli 6"></div>
    </div>

    <div class="head" style="margin-top:14px">
      <h2>Siap checkout sekarang?</h2>
      <div class="row">
        <a id="spMid" class="btn btn-sp" href="#">Checkout Shopee</a>
        <a id="waMid" class="btn btn-wa" href="#">Tanya Admin WA</a>
      </div>
    </div>

    <div class="space"></div>
  </div>

  <div class="sticky">
    <div class="row" style="justify-content:center">
      <a id="spSticky" class="btn btn-sp" href="#">Shopee (COD)</a>
      <a id="waSticky" class="btn btn-wa" href="#">WhatsApp</a>
    </div>
  </div>

  <script>
    const WA_NUMBER='6285182096568';
    const WA_TEXT=encodeURIComponent('Halo admin IFFSOO, saya mau konsultasi sebelum order.');
    const WA_URL=`https://wa.me/${WA_NUMBER}?text=${WA_TEXT}`;
    const SHOPEE_URL='https://shopee.co.id/';

    ['waTop','waMid','waSticky'].forEach(id=>{
      const el=document.getElementById(id);el.href=WA_URL;el.target='_blank';
      el.addEventListener('click',()=>{if(window.fbq){fbq('track','Lead');fbq('trackCustom','ClickWhatsApp',{placement:id});}})
    });
    ['spTop','spMid','spSticky'].forEach(id=>{
      const el=document.getElementById(id);el.href=SHOPEE_URL;el.target='_blank';
      el.addEventListener('click',()=>{if(window.fbq){fbq('track','InitiateCheckout');fbq('trackCustom','ClickShopee',{placement:id});}})
    });
  </script>
</body>
</html>
